

services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    pull_policy: build
    image: curehealth-backend:latest
    container_name: curehealth-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - PORT=5000
      - CLIENT_URL=${CLIENT_URL:-http://localhost}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - curehealth-network

  # ----------------------------------------------------------------------------
  # Frontend Web Application (React + Vite + Nginx Reverse Proxy)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_RAZORPAY_KEY_ID: ${VITE_RAZORPAY_KEY_ID:-rzp_test_TLLJHoZKSG6nBe}
    pull_policy: build
    image: curehealth-frontend:latest
    container_name: curehealth-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - curehealth-network

# ==============================================================================
# Isolated Production Bridge Network
# ==============================================================================
networks:
  curehealth-network:
    name: curehealth-network
    driver: bridge
